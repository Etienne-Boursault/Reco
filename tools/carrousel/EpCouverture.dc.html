<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modèle — couverture d’épisode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ffd23f}a:hover{color:#ffe27a}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; padding: 88px 88px 80px; background: #0e0e10; color: #f6f4ee; font-family: 'Inter', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: space-between">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 18px">
      <div style="width: 60px; height: 60px; border-radius: 15px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="36" height="36" viewBox="0 0 24 24"><path d="M12 4l2.2 4.9 5.3.5-4 3.6 1.2 5.2L12 15.9 7.3 18.7l1.2-5.2-4-3.6 5.3-.5z" fill="#0e0e10"></path></svg>
      </div>
      <div style="font-family: 'Bebas Neue', sans-serif; font-size: 38px; letter-spacing: 0.04em; line-height: 1">Les recos de l’épisode</div>
    </div>
    <div style="font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 0.04em; line-height: 1; color: #0e0e10; background: {{accent}}; border-radius: 12px; padding: 10px 18px 6px">{{numero}}</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 44px">
    <div style="font-family: 'Bebas Neue', sans-serif; font-size: 300px; line-height: 0.8; color: {{accent}}">{{nbRecos}}<span style="font-size: 120px; color: #f6f4ee"> recos</span></div>
    <h1 style="margin: 0; font-size: 60px; font-weight: 700; line-height: 1.12; letter-spacing: -0.01em; max-width: 900px">{{titre}}</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center">
      <span style="font-size: 28px; color: #c9c7c0">Avec</span>
      <sc-for list="{{invites}}" as="i" hint-placeholder-count="2">
        <span style="font-size: 30px; font-weight: 600; border: 2px solid #3a3a40; border-radius: 999px; padding: 10px 24px">{{i.nom}}</span>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; align-items: flex-end; justify-content: space-between; border-top: 2px solid #2a2a30; padding-top: 36px">
    <div style="font-size: 26px; color: #c9c7c0">Un Bon Moment · avec Kyan Khojandi et Navo</div>
    <div style="display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 700">
      Glisse
      <svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"numero":{"editor":"text","default":"S6 · E04","section":"Épisode"},"titre":{"editor":"text","default":"Félix Radu et Carla de Coignac mettent de la poésie partout","section":"Épisode"},"invites":{"editor":"text","default":"Félix Radu, Carla de Coignac","section":"Épisode"},"nbRecos":{"editor":"int","default":9,"min":1,"max":99,"section":"Épisode"},"accent":{"editor":"color","default":"#ffd23f","options":["#ffd23f","#ff8a5c","#7fd0aa"]},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
  renderVals() {
    const invites = (this.props.invites ?? 'Félix Radu, Carla de Coignac')
      .split(',').map((n) => n.trim()).filter(Boolean).map((nom) => ({ nom }));
    return {
      accent: this.props.accent ?? '#ffd23f',
      numero: this.props.numero ?? 'S6 · E04',
      titre: this.props.titre ?? 'Félix Radu et Carla de Coignac mettent de la poésie partout',
      nbRecos: this.props.nbRecos ?? 9,
      invites,
    };
  }
}
</script>
</body>
</html>
