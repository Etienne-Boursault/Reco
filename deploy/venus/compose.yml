# Reco — la chaîne automatique sur venus. Mode d'emploi : README.md à côté.
#
# Installé par un lien : /home/etienne/docker/reco/compose.yml -> ce fichier.
# C'est l'emplacement qu'archive backup-venus-local.sh, et le compose suit le
# dépôt à chaque `git pull`.
name: reco

x-atelier: &atelier
  # Étiquette explicite, jamais :latest. À changer quand requirements.txt ou le
  # Dockerfile change : sinon venus garde l'ancienne image et la mise à jour est
  # inerte. Celle-ci ajoute l'utilisateur 1000, sans lequel ssh refuse de partir.
  image: reco-atelier:2026-10-02
  build:
    context: /home/etienne/docker/reco/depot
    dockerfile: deploy/venus/Dockerfile
  user: "1000:1000"
  env_file: /home/etienne/docker/reco/.env
  # Réseau de l'hôte : la page de validation écoute sur l'adresse du VPN
  # (10.8.0.1, interface wg0), que le réseau Docker ne voit pas.
  network_mode: host
  volumes:
    - /home/etienne/docker/reco/depot:/app
    - /home/etienne/.cache/reco:/cache
    # Clé de dépôt (écriture sur ce seul dépôt), en LECTURE SEULE et au MÊME
    # chemin que sur l'hôte : le `core.sshCommand` du clone la désigne par ce
    # chemin absolu, et vaut donc des deux côtés. Sans elle, l'étape `publier`
    # ne peut pas pousser.
    - /home/etienne/.ssh/reco_deploy:/home/etienne/.ssh/reco_deploy:ro

services:
  # Page de validation. Elle n'a AUCUNE authentification : ce qui la protège est
  # le pare-feu, et lui seul.
  #
  # Jusqu'au 2026-10-02 elle n'écoutait que sur 10.8.0.1, l'adresse du VPN. Mais
  # l'éditeur, chez lui, devait monter un VPN pour atteindre une machine à trois
  # mètres de lui : décision prise d'ouvrir au réseau local. Elle écoute donc sur
  # toutes les interfaces, et ufw n'autorise le port 8000 que depuis
  # 192.168.1.0/24 et 10.8.0.0/24 — Internet reste exclu par le refus par défaut.
  #
  # ⚠️ Conséquence assumée : tout appareil du Wi-Fi peut valider, écarter ou
  # modifier une reco. Pour refermer sans perdre l'accès local, le motif existe
  # déjà dans le dépôt : `/audience` exige une clé dans l'URL et répond 404 sans
  # elle (cf. `src/lib/audience/`).
  #
  # L'écoute réussit désormais même si wg0 n'est pas monté, d'où la sonde de
  # santé sur 127.0.0.1 : viser l'adresse du VPN la ferait échouer à chaque
  # démarrage antérieur au tunnel.
  review:
    <<: *atelier
    container_name: reco-review
    restart: unless-stopped
    command: ["python", "review_server.py", "--source", "un-bon-moment",
              "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.socket(); s.settimeout(3); sys.exit(s.connect_ex(('127.0.0.1', 8000)))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Outils lancés à la demande par tick.sh (`docker compose run --rm pipeline …`).
  pipeline:
    <<: *atelier
    container_name: reco-pipeline
    profiles: ["outils"]
