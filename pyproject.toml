# B-MED-12 — Python 3.11+ requis pour `tools/stats/aggregator.py`
# (datetime.fromisoformat avec suffixe `Z`). Cette contrainte est
# vérifiée à l'exécution par le shebang du venv, et déclarée ici pour
# qu'un fork qui packagerait le pipeline en wheel l'expose au pip.
[project]
name = "reco-tools"
version = "0.0.0"
description = "Pipeline interne Reco (privé)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short --import-mode=importlib"
markers = [
    "slow: tests lents (intégration Docker, benchmarks)",
    "perf: tests de performance / scaling (skip défaut)",
    "network: tests nécessitant accès réseau réel (skip défaut)",
]

# ---------------------------------------------------------------------------
# Couverture — source de vérité UNIQUE (les anciens `.coveragerc` racine et
# `tools/.coveragerc` ont été supprimés le 2026-07-29 : coverage.py donne la
# priorité à `.coveragerc`, donc leur simple présence rendait cette section
# inopérante, et l'un des deux mesurait sans `branch`).
#
#     pytest tests/ --cov=tools --cov-report=term-missing
#
# `branch = true` est REQUIS : sans lui, la couverture de branches n'est pas
# mesurée et l'exigence « ≥95 % sur toutes les métriques » n'est pas prouvée.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["tools"]
# PAS D'EXCLUSION DE CODE. La mesure porte sur TOUT `tools/`.
#
# Il y avait ici une liste de 10 « scripts jetables ». Elle a été supprimée le
# 2026-07-29, une fois le périmètre COMPLET passé au-dessus de la barre :
#
#     avec l'ancienne liste   statements 99,62 %  ·  branches 98,31 %
#     sans aucune exclusion   statements 96,83 %  ·  branches 96,00 %
#
# Les deux au-dessus de 95 %, avec 45 branches et 274 instructions de marge.
# Tant que le chiffre tient sans exclusion, en garder une est une dette pure :
# c'est une frontière éditoriale déguisée en configuration, que personne ne
# rouvre, et qui finit par masquer autre chose. Ce dépôt en a fait deux fois
# les frais le même jour —
#   - `tools/.coveragerc` (supprimé) excluait `tools/cache/*` et
#     `tools/dispatch/*` : du code de PRODUCTION, testé, hors du calcul ;
#   - `migrate_types.py`, `export_similar_works.py` et `eval_local_llm.py`
#     étaient listés à tort alors qu'ils avaient chacun leur suite de tests —
#     l'exclusion empêchait purement et simplement de la mesurer.
#
# Si un jour un script réellement jetable fait passer la mesure sous 95 %, la
# réponse est de le tester, ou de ne pas le committer dans `tools/` — pas de
# rouvrir cette liste.
#
# `tools/.venv/*` reste exclu : ce sont les dépendances installées, pas le
# code du projet.
omit = ["tools/.venv/*"]

[tool.coverage.report]
# Garde-fou global. La vérification par métrique (statements ET branches)
# se lit dans le rapport : colonnes `Miss` et `BrPart`/`Branch`.
fail_under = 95
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"
