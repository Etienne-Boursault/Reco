version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      dev-tooling:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@fontsource/*"
    labels:
      - dependencies
      - npm

  - package-ecosystem: pip
    directory: "/tools"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - docker
    # Les MAJEURES des images de base sont refusées volontairement : le
    # Dockerfile doit refléter ce qui tourne réellement, pas la dernière
    # version disponible. Les mineures et correctifs restent proposés.
    ignore:
      # Node 24 = version servie en production (Infomaniak). Une image de
      # build qui avance seule créerait un écart avec le runtime réel.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # Python 3.12 = version testée par la matrice CI. Passer l'image à 3.14
      # sans bouger la matrice ferait diverger ce qui est construit de ce qui
      # est testé, et `fastembed`/`faster-whisper` n'y sont pas validés. À
      # traiter comme une migration à part entière, matrice CI comprise.
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]
