name: RSS poll (daily)

# Item roadmap #23 / ADR 0042 — veille des flux RSS configurés : notifie Matrix
# (ou Discord/Slack/email) quand un nouvel épisode paraît. Voir tools/poll_rss.py.
#
# Elle NE déclenche PAS le traitement de l'épisode. Jusqu'au 2026-09-17 elle
# passait `--dispatch-event`, qui postait un `repository_dispatch` : GitHub le
# refusait (403, le jeton n'a pas `contents: write`) et aucun workflow ne
# l'écoutait. Le traitement d'un épisode se lance ailleurs.

on:
  schedule:
    # Tous les jours à 05:00 UTC (07:00 Paris en été, 06:00 en hiver).
    #
    # POURQUOI QUOTIDIEN — constaté le 2026-09-17. L'état de la veille (les
    # épisodes déjà vus) vit dans le cache GitHub Actions, et GitHub efface
    # tout cache non lu depuis 7 jours. Au rythme hebdomadaire, la veille
    # tournait tous les 7 jours ET quelques heures, GitHub retardant les
    # tâches programmées d'une à sept heures : trois lundis sur quatre, le
    # cache avait disparu, et la veille repartait de zéro en notifiant les
    # 5 derniers épisodes, anciens compris. Lu chaque jour, il ne vieillit plus.
    #
    # POURQUOI 05:00 UTC — la vidéo YouTube d'un épisode sort le dimanche à
    # 08:00 UTC, mais le flux Acast ne la reçoit que le lundi entre 03:00 et
    # 04:00 UTC (relevé sur les cinq derniers épisodes de la saison 5). Une
    # veille RSS ne peut donc rien signaler avant le lundi, quel que soit son
    # rythme : on passe une à deux heures après Acast. GitHub retardant encore
    # le départ, la notification arrive le lundi matin.
    #
    # ⚠️ Dépôt public : GitHub désactive les tâches programmées après 60 jours
    # sans commit. Deux mois sans épisode traité suffisent à couper la veille.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source ID ou "all"'
        default: 'all'
        required: false
      notify:
        description: 'Canal de notification (matrix|discord|slack|email|none)'
        default: 'matrix'
        required: false

# Lecture seule : la veille lit le dépôt et notifie, rien d'autre.
permissions:
  contents: read

concurrency:
  group: cron-rss-${{ github.ref }}
  cancel-in-progress: false

jobs:
  poll:
    name: Poll RSS feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Restore RSS polling state
        # L'état est petit (~10 KB / source) — on le persiste via le cache
        # GitHub Actions pour ne pas re-notifier à chaque run. Il n'y survit
        # que s'il est relu en moins de 7 jours : voir le `schedule` plus haut.
        uses: actions/cache@v6
        with:
          path: tools/output/rss
          key: rss-state-${{ github.run_id }}
          restore-keys: |
            rss-state-

      - name: Poll RSS feeds
        env:
          # Matrix (canal par défaut) — bot qui poste dans le salon de notif.
          RECO_MATRIX_HOMESERVER: ${{ secrets.RECO_MATRIX_HOMESERVER }}
          RECO_MATRIX_TOKEN: ${{ secrets.RECO_MATRIX_TOKEN }}
          RECO_MATRIX_ROOM: ${{ secrets.RECO_MATRIX_ROOM }}
          # Discord conservé en repli optionnel (--notify discord).
          RECO_DISCORD_WEBHOOK: ${{ secrets.RECO_DISCORD_WEBHOOK }}
          # Passer par env: plutôt que d'interpoler dans le `run:`. GitHub
          # substitue les ${{ }} AVANT que le shell existe : une valeur contenant
          # `"; curl … #` deviendrait du code exécuté. Via une variable, le shell
          # reçoit une donnée, pas du texte à interpréter.
          SOURCE: ${{ inputs.source || 'all' }}
          NOTIFY: ${{ inputs.notify || 'matrix' }}
        run: |
          python tools/poll_rss.py \
            --source "$SOURCE" \
            --notify "$NOTIFY" \
            --json

      - name: Upload state diff artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rss-state
          path: tools/output/rss/
          retention-days: 30
          if-no-files-found: ignore
