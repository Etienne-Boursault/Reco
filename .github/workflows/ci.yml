name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Permissions minimales par défaut. Aucun job n'a besoin d'écrire sur le
# repo. Les jobs qui auraient besoin de permissions supplémentaires
# doivent les déclarer explicitement.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install ruff
        run: pip install ruff

      # BLOQUANT depuis le 2026-07-29. Auparavant `|| true` « tant que
      # pyproject.toml n'a pas de config ruff » : il n'y en a jamais eu, donc
      # personne n'a lu la sortie — 959 erreurs s'y étaient accumulées, dont un
      # `assert False` effacé par `python -O`, une closure sur variable de
      # boucle et 12 `subprocess.run` sans `check`. Le jeu de règles est
      # désormais FIGÉ dans `[tool.ruff]` (pyproject.toml) : la CI installe
      # ruff sans épingle, et les défauts de ruff changent d'une version à
      # l'autre.
      - name: Run ruff
        run: ruff check tools/ tests/ scripts/

  test-python:
    name: Test Python (pytest)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: tools/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install pytest pytest-cov

      # La couverture est MESURÉE en CI, pas seulement configurée : jusqu'au
      # 2026-07-29 ce job lançait `pytest -q` sans `--cov`, donc le
      # `fail_under = 95` du projet n'a jamais été évalué une seule fois. Les
      # branches, elles, n'étaient pas mesurées du tout — et étaient sous la
      # barre (94,8 %) sans que rien ne le signale.
      # `--cov-fail-under=0` NEUTRALISE volontairement le `fail_under = 95` de
      # `pyproject.toml` : il porte sur un total COMBINÉ lignes+branches, donc
      # il échouerait avant l'étape suivante, avec un message moins clair et
      # sur le mauvais critère. Un seul garde-fou fait autorité, celui d'après.
      - name: Run pytest (avec couverture branches)
        run: pytest tests/ -q --tb=short --cov=tools --cov-branch --cov-report=json --cov-report=term-missing --cov-fail-under=0

      # `--cov-fail-under` porte sur un TOTAL COMBINÉ lignes+branches : un run
      # à 99 % de lignes et 91 % de branches affiche 96,7 % en combiné et
      # passerait. L'exigence étant ≥ 95 % sur CHAQUE métrique, on les vérifie
      # séparément — c'est CE garde-fou qui fait foi.
      - name: Vérifier le seuil par métrique
        run: python scripts/check_coverage.py --min 95

  lint-js:
    name: Lint JS / Astro
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install deps
        run: npm ci

      # BLOQUANT depuis le 2026-07-29. Auparavant `|| true`, et surtout
      # `@astrojs/check` n'était même pas installé : la commande demandait une
      # confirmation interactive, échouait, et le `|| true` l'avalait — le
      # typage n'a jamais été vérifié une seule fois. Même motif que la
      # couverture, qui n'était mesurée par aucun job.
      # `SITE_URL` est requis : vitest.config.ts charge astro.config.mjs, qui
      # exige la variable hors dev.
      - name: Astro check (types)
        env:
          SITE_URL: https://example.com
        run: npx astro check

  test-vitest:
    name: Test Vitest (SEO + OG)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # vitest.config.ts charge astro.config.mjs, qui exige SITE_URL en prod.
      SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # Plusieurs tests SEO/OG sont des gardes post-build : ils échouent
      # volontairement (expect.fail) si dist/ n'existe pas. On build donc
      # avant (SITE_URL vient de l'env du job).
      - name: Build (SSG)
        run: npm run build

      # Idem côté frontend : `npm run test:seo` lançait `vitest run` SANS
      # `--coverage`, donc les seuils de `vitest.config.ts` n'étaient jamais
      # évalués. C'est ainsi que le dépôt a pu dériver à 67 % de lignes et
      # 61 % de branches, avec 41 fichiers sur 97 jamais exécutés.
      # Les seuils de vitest s'appliquent bien métrique par métrique.
      - name: Run vitest (avec couverture)
        run: npm run test:coverage

  build:
    name: Build SSG
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build Astro
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7

  # Note : l'a11y (statique + contraste + pa11y informatif) est gérée
  # par le workflow dédié `.github/workflows/a11y.yml` (cf. ADR 0024).
  # On ne la duplique pas ici.

  build-prod:
    name: Build production (comme l'hébergeur)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://example.com
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # `--omit=dev` et `RECO_SSR=1` : c'est EXACTEMENT ce que fait la
      # commande de construction d'Infomaniak. Le job `build` voisin, lui,
      # installe tout et construit en statique — il ne pouvait donc pas voir
      # ce qui a mis le site hors ligne quarante minutes le 2026-08-21 :
      # `@fontsource/inter`, importée par `src/styles/global.css`, était
      # rangée en devDependencies et disparaissait sous `--omit=dev`.
      #
      #   [vite] Unable to resolve `@import "@fontsource/inter/400.css"`
      #
      # En production, une construction ratée laisse le site MORT : Astro vide
      # `dist/` avant de reconstruire, et l'application n'a plus d'entrée à
      # charger. Ce job est la garde qui évite d'y arriver.
      - run: npm ci --omit=dev

      - name: Construire comme en production
        run: RECO_SSR=1 npm run build

      - name: L'entrée serveur existe-t-elle vraiment ?
        run: |
          # Sans ce contrôle, un build qui « réussit » sans produire l'entrée
          # passerait : c'est ce fichier que `server.mjs` importe au démarrage,
          # et son absence est exactement l'erreur qu'on a vue en production.
          test -f dist/server/entry.mjs             || { echo "::error::dist/server/entry.mjs manquant après le build."; exit 1; }
          echo "dist/server/entry.mjs présent."

  ci-summary:
    name: CI summary
    needs: [lint-python, test-python, lint-js, test-vitest, build, build-prod]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # TOUS les jobs de `needs` doivent figurer dans la condition d'échec.
      #
      # `lint-python` et `lint-js` étaient déclarés en `needs`, affichés par
      # les `echo`, et absents de la condition d'échec. Tant
      # qu'ils tournaient en `|| true` c'était sans effet. Depuis qu'ils sont
      # bloquants (ruff 959 -> 0, astro check 158 -> 0), c'était la SEULE
      # chose qui séparait « bloquant » de « décoratif » : les deux jobs
      # pouvaient virer au rouge pendant que `ci-summary` — le check
      # vraisemblablement requis par la protection de branche — passait au
      # vert. Trouvé en revue d'architecture le 2026-07-29.
      #
      # Si un job est ajouté à `needs`, il doit être ajouté ici. La boucle
      # ci-dessous évite d'avoir à y penser : elle itère sur les résultats
      # plutôt que de les énumérer une seconde fois.
      - name: Aggregate result
        env:
          RESULTS: |
            lint-python=${{ needs.lint-python.result }}
            test-python=${{ needs.test-python.result }}
            lint-js=${{ needs.lint-js.result }}
            test-vitest=${{ needs.test-vitest.result }}
            build=${{ needs.build.result }}
            build-prod=${{ needs.build-prod.result }}
        run: |
          echec=0
          while IFS='=' read -r job resultat; do
            [ -z "$job" ] && continue
            printf '  %-12s %s\n' "$job" "$resultat"
            if [ "$resultat" != "success" ]; then
              echo "::error::Job bloquant en échec : $job ($resultat)"
              echec=1
            fi
          done <<< "$RESULTS"
          exit "$echec"
