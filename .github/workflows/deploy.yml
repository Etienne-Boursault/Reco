# Déploiement en production (Infomaniak).
#
# POURQUOI CE FICHIER EXISTE
# --------------------------
# Le déploiement était manuel : ouvrir la console SSH de l'app dans le Manager
# Infomaniak, coller `git fetch && git reset --hard && npm run build`, puis
# cliquer sur « Redémarrer ». Résultat mesuré le 2026-08-20 : la production
# tournait encore sur le code du 28 juillet, sans compression — 2,6 Mo envoyés
# à chaque visiteur là où 200 Ko suffisaient. Un déploiement qu'on oublie de
# faire est un déploiement qui n'a pas lieu.
#
# CE QU'IL A FALLU COMPRENDRE
# ---------------------------
# L'API des sites Node.js n'est pas documentée : les trois chemins ont été
# trouvés en observant ce que le Manager émet lui-même.
#
# 1. Le préfixe est `hostings` AU PLURIEL, et le site Node.js est un produit
#    distinct de l'hébergement web (`service_id` 57 contre 1) — d'où le 403
#    sur `/1/web/…`, qui a longtemps ressemblé à un problème de droits.
# 2. `actions/restart` ne reconstruit PAS : il relance le processus. Trois
#    redémarrages d'affilée, pas un seul travail créé.
# 3. Enregistrer la configuration ne reconstruit pas non plus : `PATCH` répond
#    `200 {"data":true}` et il ne se passe rien, même quand la valeur change
#    réellement.
#
# C'est `actions/build` qu'il fallait — l'appel derrière le bouton « Build »
# du Manager. Après une construction réussie, Infomaniak redémarre
# l'application de lui-même.
#
# Chacune de ces impasses a été vue parce que le workflow refuse d'annoncer un
# succès qu'il n'a pas vérifié : il attend que le SHA déployé apparaisse dans
# `version.txt`. Sans ce contrôle, trois versions successives auraient affiché
# un coche vert sur une production restée au 28 juillet.
#
# POURQUOI IL SE DÉCLENCHE APRÈS LA CI, PAS SUR LE PUSH
# ----------------------------------------------------
# Déployer sur `push` mettrait en ligne du code dont on ignore s'il compile.
# `workflow_run` attend que la CI ait conclu `success` sur `main`. Le premier
# push de cette série avait justement une CI rouge : cinq erreurs de type et
# la couverture sous son seuil.
name: Déploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Aucun job n'écrit sur le dépôt.
permissions:
  contents: read

# `cancel-in-progress: false` : interrompre un déploiement en cours laisserait
# l'app à moitié construite. Les déploiements s'enchaînent, ils ne se doublent
# pas.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    name: Construire et mettre en ligne
    # Sur `workflow_dispatch` il n'y a pas de `workflow_run` à interroger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE: https://unebonnere.co
      API: https://api.infomaniak.com

    steps:
      - name: Identifier le commit à déployer
        id: cible
        run: |
          # Sur `workflow_run`, `github.sha` désigne le commit du workflow
          # déclencheur, pas celui qui a été testé : c'est `head_sha` qu'il
          # faut lire, sans quoi on vérifierait le mauvais SHA.
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # L'instant du déclenchement sert à ne reconnaître que les travaux
          # nés de CE déploiement — voir « Attendre la fin de la construction ».
          echo "debut=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "Commit visé : $sha"

      - name: Vérifier que la configuration est complète
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
        run: |
          # Échouer ici, avec un message clair, plutôt que d'envoyer une
          # requête sans jeton et de lire un 401 sans savoir pourquoi.
          manquant=0
          for nom in TOKEN HOSTING APP; do
            if [ -z "${!nom}" ]; then
              echo "::error::$nom est vide."
              manquant=1
            fi
          done
          if [ "$manquant" = 1 ]; then
            echo "Attendus : le secret INFOMANIAK_API_TOKEN (portée « web »)," >&2
            echo "et les variables INFOMANIAK_HOSTING_ID / INFOMANIAK_NODEJS_ID." >&2
            exit 1
          fi

      - name: Vérifier que le jeton est accepté
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
        run: |
          set -euo pipefail
          # Un jeton copié depuis Windows arrive souvent avec un `\r` collé à
          # la valeur : l'en-tête `Authorization` devient invalide et l'API
          # rend 401 sans autre explication. On nettoie avant d'appeler.
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$API/1/hostings/$HOSTING" -H "Authorization: Bearer $jeton")
          case "$code" in
            200) echo "Jeton accepté." ;;
            401) echo "::error::Jeton refusé (401). Il est révoqué, expiré," \
                   "ou la valeur du secret est altérée — un retour à la ligne" \
                   "copié avec le jeton suffit. Recrée-le et repose-le avec" \
                   "'gh secret set INFOMANIAK_API_TOKEN'."
                 exit 1 ;;
            403) echo "::error::Jeton valide mais sans droit sur cet" \
                   "hébergement (403). Il lui manque la portée « web »."
                 exit 1 ;;
            *)   echo "::error::Réponse inattendue de l'API (HTTP $code)."
                 exit 1 ;;
          esac

      - name: Lancer la construction
        # `actions/build` est l'appel que le Manager émet derrière son bouton
        # « Build ». C'est LUI qui rejoue la commande de construction —
        # `actions/restart` ne fait que relancer le processus, et enregistrer
        # la configuration ne déclenche rien. Après une construction réussie,
        # Infomaniak redémarre l'application de lui-même : aucun redémarrage
        # n'est à demander ici.
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
        run: |
          set -euo pipefail
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          code=$(curl -sS -o reponse.json -w '%{http_code}' -X POST \
            "$API/1/hostings/$HOSTING/nodejs/$APP/actions/build" \
            -H "Authorization: Bearer $jeton" \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code  $(head -c 200 reponse.json)"
          if [ "$code" != "200" ]; then
            echo "::error::La construction a été refusée (HTTP $code)."
            exit 1
          fi

      - name: Attendre la fin de la construction
        # Le marqueur seul ne suffit PAS à savoir que la construction est
        # finie : quand on redéploie un commit déjà en ligne, il porte le bon
        # SHA dès la première seconde, alors que le nouveau build vient à peine
        # de démarrer. C'est ce qui a fait échouer le premier déploiement
        # automatique — il a « constaté » le succès puis interrogé un site qui
        # était, lui, en pleine reconstruction.
        #
        # On suit donc le travail, et on ne regarde que ceux nés de CE
        # déploiement : un travail plus ancien ne prouve rien.
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
          DEBUT: ${{ steps.cible.outputs.debut }}
        run: |
          set -euo pipefail
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          vus_sans_travail=0
          for essai in $(seq 1 60); do
            sleep 15
            statut=$(curl -fsS --max-time 20 "$API/1/hostings/$HOSTING/nodejs/$APP/jobs" \
              -H "Authorization: Bearer $jeton" \
              | python3 -c 'import json, sys, os; debut = int(os.environ["DEBUT"]) - 60; recents = sorted((j for j in json.load(sys.stdin).get("data", []) if j.get("created_at", 0) >= debut), key=lambda j: j["created_at"], reverse=True); print(recents[0]["status"] if recents else "aucun")') || statut="illisible"
            echo "essai $essai/60 — construction : $statut"
            case "$statut" in
              Succeeded) echo "Construction terminée."; exit 0 ;;
              Failed|Cancelled)
                echo "::error::La construction a échoué ($statut). La console" \
                     "« Build » du Manager en donne la ligne exacte."
                exit 1 ;;
              aucun)
                vus_sans_travail=$((vus_sans_travail + 1))
                if [ "$vus_sans_travail" -ge 12 ]; then
                  echo "::error::Aucun travail n'est apparu en trois minutes —" \
                       "la construction n'a pas démarré."
                  exit 1
                fi ;;
            esac
          done
          echo "::error::La construction n'a pas abouti en quinze minutes."
          exit 1

      - name: Vérifier que le commit visé est en ligne
        # Infomaniak redémarre l'application de lui-même après une construction
        # réussie — il n'y a donc pas de redémarrage à demander ici. Il y en
        # avait un dans la version précédente : il tombait au milieu du build
        # suivant et coupait le site.
        env:
          ATTENDU: ${{ steps.cible.outputs.sha }}
        run: |
          for essai in $(seq 1 20); do
            sleep 15
            enligne=$(curl -fsS --max-time 20 "$SITE/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$enligne" = "$ATTENDU" ]; then
              echo "En ligne : $enligne (essai $essai)"
              exit 0
            fi
            echo "essai $essai/20 — en ligne : ${enligne:-<indisponible>}"
          done
          echo "::error::Le commit $ATTENDU n'est pas en ligne. La construction" \
               "a pourtant abouti : vérifier que la commande de construction" \
               "écrit bien dist/client/version.txt."
          exit 1

      - name: Que s'est-il passé côté Infomaniak ?
        # Sans cette étape, un échec ne disait pas si la commande de
        # construction avait été enregistrée, si elle avait tourné, ou si elle
        # avait échoué. Elle n'expose aucun secret : la configuration ne
        # contient que des commandes, et `log_stream` — qui porte un jeton
        # d'accès aux journaux — est écarté.
        if: failure()
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
        run: |
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          echo "--- configuration enregistrée ---"
          curl -sS "$API/1/hostings/$HOSTING/nodejs/$APP?with=environments" \
            -H "Authorization: Bearer $jeton" \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin).get("data",{}).get("environment",{}), indent=2, ensure_ascii=False))' \
            || echo "(configuration illisible)"
          echo "--- derniers travaux ---"
          curl -sS "$API/1/hostings/$HOSTING/nodejs/$APP/jobs" \
            -H "Authorization: Bearer $jeton" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",[]); print(json.dumps([{k:j[k] for k in ("status","created_at") if k in j} for j in d], indent=2)) if d else print("aucun travail enregistré")' \
            || echo "(travaux illisibles)"
          echo "--- journaux du site Node.js ---"
          echo "Le Manager les montre en clair ; l'API n'y donne accès qu'avec" \
               "un jeton de flux qu'on ne veut pas faire transiter ici."

      - name: Vérifier que le site répond
        run: |
          # Le marqueur est un fichier statique : il peut être servi alors que
          # l'application, elle, n'a pas repris. On vérifie donc une page rendue
          # par le serveur, et on laisse au processus le temps de démarrer
          # plutôt que de conclure sur un seul appel.
          for essai in $(seq 1 8); do
            sleep 15
            code=$(curl -sS -o page.html -w '%{http_code}' --max-time 30 "$SITE/" || echo 000)
            if [ "$code" = "200" ] && ! grep -qi "under maintenance" page.html; then
              echo "GET / -> 200 (essai $essai)"
              exit 0
            fi
            echo "essai $essai/8 — GET / -> $code"
          done
          echo "::error::Le site ne répond pas normalement après la mise en ligne."
          exit 1
