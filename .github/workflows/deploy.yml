# Déploiement en production (Infomaniak).
#
# POURQUOI CE FICHIER EXISTE
# --------------------------
# Le déploiement était manuel : ouvrir la console SSH de l'app dans le Manager
# Infomaniak, coller `git fetch && git reset --hard && npm run build`, puis
# cliquer sur « Redémarrer ». Résultat mesuré le 2026-08-20 : la production
# tournait encore sur le code du 28 juillet, sans compression — 2,6 Mo envoyés
# à chaque visiteur là où 200 Ko suffisaient. Un déploiement qu'on oublie de
# faire est un déploiement qui n'a pas lieu.
#
# CE QU'IL A FALLU COMPRENDRE
# ---------------------------
# 1. L'API des sites Node.js n'est pas documentée. Le chemin a été trouvé en
#    observant ce que le Manager émet lui-même. Le préfixe est `hostings` au
#    pluriel, et le site Node.js est un produit distinct de l'hébergement web
#    (`service_id` 57 contre 1) — d'où le 403 sur `/1/web/…`.
# 2. « Redémarrer » ne reconstruit PAS. Trois redémarrages d'affilée, pas un
#    seul travail créé : le seul que l'API connaissait datait de juillet.
# 3. Renvoyer la configuration à l'identique ne reconstruit pas non plus.
#    L'appel est accepté (`200 {"data":true}`) et il ne se passe rien.
#    La construction se déclenche quand la configuration CHANGE — d'où le
#    marqueur de déploiement ajouté à la commande de construction.
#
# Chacune de ces trois étapes a été découverte parce que le workflow refuse
# d'annoncer un succès qu'il n'a pas vérifié : il attend que le SHA déployé
# apparaisse dans `version.txt`. Sans ce contrôle, les trois versions
# précédentes auraient toutes affiché un joli coche vert.
#
# POURQUOI IL SE DÉCLENCHE APRÈS LA CI, PAS SUR LE PUSH
# ----------------------------------------------------
# Déployer sur `push` mettrait en ligne du code dont on ignore s'il compile.
# `workflow_run` attend que la CI ait conclu `success` sur `main`. Le premier
# push de cette série avait justement une CI rouge : cinq erreurs de type et
# la couverture sous son seuil.
name: Déploiement

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Aucun job n'écrit sur le dépôt.
permissions:
  contents: read

# `cancel-in-progress: false` : interrompre un déploiement en cours laisserait
# l'app à moitié construite. Les déploiements s'enchaînent, ils ne se doublent
# pas.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    name: Construire et mettre en ligne
    # Sur `workflow_dispatch` il n'y a pas de `workflow_run` à interroger.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE: https://unebonnere.co
      API: https://api.infomaniak.com

    steps:
      - name: Identifier le commit à déployer
        id: cible
        run: |
          # Sur `workflow_run`, `github.sha` désigne le commit du workflow
          # déclencheur, pas celui qui a été testé : c'est `head_sha` qu'il
          # faut lire, sans quoi on vérifierait le mauvais SHA.
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit visé : $sha"

      - name: Vérifier que la configuration est complète
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
        run: |
          # Échouer ici, avec un message clair, plutôt que d'envoyer une
          # requête sans jeton et de lire un 401 sans savoir pourquoi.
          manquant=0
          for nom in TOKEN HOSTING APP; do
            if [ -z "${!nom}" ]; then
              echo "::error::$nom est vide."
              manquant=1
            fi
          done
          if [ "$manquant" = 1 ]; then
            echo "Attendus : le secret INFOMANIAK_API_TOKEN (portée « web »)," >&2
            echo "et les variables INFOMANIAK_HOSTING_ID / INFOMANIAK_NODEJS_ID." >&2
            exit 1
          fi

      - name: Vérifier que le jeton est accepté
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
        run: |
          set -euo pipefail
          # Un jeton copié depuis Windows arrive souvent avec un `\r` collé à
          # la valeur : l'en-tête `Authorization` devient invalide et l'API
          # rend 401 sans autre explication. On nettoie avant d'appeler.
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "$API/1/hostings/$HOSTING" -H "Authorization: Bearer $jeton")
          case "$code" in
            200) echo "Jeton accepté." ;;
            401) echo "::error::Jeton refusé (401). Il est révoqué, expiré," \
                   "ou la valeur du secret est altérée — un retour à la ligne" \
                   "copié avec le jeton suffit. Recrée-le et repose-le avec" \
                   "'gh secret set INFOMANIAK_API_TOKEN'."
                 exit 1 ;;
            403) echo "::error::Jeton valide mais sans droit sur cet" \
                   "hébergement (403). Il lui manque la portée « web »."
                 exit 1 ;;
            *)   echo "::error::Réponse inattendue de l'API (HTTP $code)."
                 exit 1 ;;
          esac

      - name: Déclencher la construction
        # On relit la configuration, on y estampille le commit visé, et on la
        # renvoie. Le marqueur est un commentaire shell : il ne change rien à
        # l'exécution de la commande, mais il rend la configuration DIFFÉRENTE
        # de la précédente — sans quoi l'API accepte l'appel et ne reconstruit
        # rien. Il dit aussi, dans le Manager, quel commit a été déployé en
        # dernier.
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
          SHA: ${{ steps.cible.outputs.sha }}
        run: |
          set -euo pipefail
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          racine="$API/1/hostings/$HOSTING/nodejs/$APP"

          curl -fsS "$racine?with=environments" \
            -H "Authorization: Bearer $jeton" -o config.json
          python3 -c 'import json, os; env = json.load(open("config.json"))["data"]["environment"]; garde = ("version", "start_command", "build_command", "port"); champs = {k: env[k] for k in garde if k in env}; base = champs.get("build_command", "").split("  # deploiement:")[0].rstrip(); champs["build_command"] = base + "  # deploiement:" + os.environ["SHA"]; json.dump(champs, open("corps.json", "w")); print("commande de construction :", champs["build_command"])'

          # `PUT` rend 404 `method_not_found` sur cette ressource : c'est
          # `PATCH` qu'elle attend.
          code=$(curl -sS -o reponse.json -w '%{http_code}' -X PATCH \
            "$racine" -H "Authorization: Bearer $jeton" \
            -H 'Content-Type: application/json' --data @corps.json)
          echo "PATCH -> $code  $(head -c 200 reponse.json)"
          if [ "$code" != "200" ]; then
            echo "::error::La configuration a été refusée (HTTP $code) — la" \
                 "construction n'a donc pas été relancée."
            exit 1
          fi

      - name: Attendre que le commit visé soit en ligne
        env:
          ATTENDU: ${{ steps.cible.outputs.sha }}
        run: |
          # La construction dure plusieurs minutes. Le seul signal qui compte
          # est le marqueur écrit par la commande de construction elle-même :
          # tant qu'il ne porte pas ce SHA, le nouveau code n'est pas en ligne.
          #
          # 60 tentatives × 15 s = 15 minutes, sous le `timeout-minutes: 25`
          # du job pour que l'échec soit celui-ci, explicite, et non un job
          # coupé net.
          for essai in $(seq 1 60); do
            sleep 15
            enligne=$(curl -fsS --max-time 20 "$SITE/version.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$enligne" = "$ATTENDU" ]; then
              echo "En ligne : $enligne (essai $essai)"
              exit 0
            fi
            echo "essai $essai/60 — en ligne : ${enligne:-<indisponible>}"
          done

          echo "::error::Le commit $ATTENDU n'est pas en ligne après 15 minutes."
          exit 1

      - name: Redémarrer pour charger le nouveau code
        # `server.mjs` importe `dist/server/entry.mjs` au démarrage : sans
        # relance, le processus continue de servir l'ancien code même après une
        # construction réussie. Le marqueur, lui, est un fichier statique — il
        # peut être à jour alors que le serveur ne l'est pas.
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
        run: |
          set -euo pipefail
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          code=$(curl -sS -o reponse.json -w '%{http_code}' -X POST \
            "$API/1/hostings/$HOSTING/nodejs/$APP/actions/restart" \
            -H "Authorization: Bearer $jeton" \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code  $(cat reponse.json)"
          [ "$code" = "200" ] || { echo "::error::Redémarrage refusé."; exit 1; }

      - name: Que s'est-il passé côté Infomaniak ?
        # Sans cette étape, un échec ne disait pas si la commande de
        # construction avait été enregistrée, si elle avait tourné, ou si elle
        # avait échoué. Elle n'expose aucun secret : la configuration ne
        # contient que des commandes, et `log_stream` — qui porte un jeton
        # d'accès aux journaux — est écarté.
        if: failure()
        env:
          TOKEN: ${{ secrets.INFOMANIAK_API_TOKEN }}
          HOSTING: ${{ vars.INFOMANIAK_HOSTING_ID }}
          APP: ${{ vars.INFOMANIAK_NODEJS_ID }}
        run: |
          jeton=$(printf '%s' "$TOKEN" | tr -d '\r\n')
          echo "--- configuration enregistrée ---"
          curl -sS "$API/1/hostings/$HOSTING/nodejs/$APP?with=environments" \
            -H "Authorization: Bearer $jeton" \
            | python3 -c 'import json,sys; print(json.dumps(json.load(sys.stdin).get("data",{}).get("environment",{}), indent=2, ensure_ascii=False))' \
            || echo "(configuration illisible)"
          echo "--- derniers travaux ---"
          curl -sS "$API/1/hostings/$HOSTING/nodejs/$APP/jobs" \
            -H "Authorization: Bearer $jeton" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin).get("data",[]); print(json.dumps([{k:j[k] for k in ("status","created_at") if k in j} for j in d], indent=2)) if d else print("aucun travail enregistré")' \
            || echo "(travaux illisibles)"
          echo "--- journaux du site Node.js ---"
          echo "Le Manager les montre en clair ; l'API n'y donne accès qu'avec" \
               "un jeton de flux qu'on ne veut pas faire transiter ici."

      - name: Vérifier que le site répond
        run: |
          # Après un redémarrage, laisser le temps au processus de reprendre.
          sleep 20
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$SITE/")
          echo "GET / -> $code"
          [ "$code" = "200" ] || { echo "::error::Le site répond $code."; exit 1; }
